<!doctype html>
<html lang="uz">
<head>
  <title>Kirish — Finodex</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='6' width='20' height='20' fill='%230e7c86'/%3E%3Crect x='6' y='6' width='20' height='20' fill='%2310232e' transform='rotate(45 16 16)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
  <aside class="auth-aside">
    <a class="logo" href="/">
      <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="6" width="20" height="20" fill="#9fdde2"/><rect x="6" y="6" width="20" height="20" fill="#0a5a62" transform="rotate(45 16 16)"/></svg>
      Finodex
    </a>
    <div>
      <h2>Kassangiz holatini bugun bilib oling.</h2>
      <p>Hisobingizga kiring va keyingi 60 kunlik kassa prognozini ko'ring.</p>
    </div>
    <svg class="tiles" viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="2"><rect x="40" y="40" width="120" height="120"/><rect x="40" y="40" width="120" height="120" transform="rotate(45 100 100)"/><rect x="65" y="65" width="70" height="70"/><rect x="65" y="65" width="70" height="70" transform="rotate(45 100 100)"/></g></svg>
  </aside>
  <main class="auth-main">
    <div class="auth-card">
      <h1>Tizimga kirish</h1>
      <p class="sub">Email va parolingizni kiriting.</p>
      <div id="form-error" class="form-error" role="alert"></div>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Parol</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary" type="submit">Kirish</button>
      </form>
      <p class="auth-switch">Hisobingiz yo'qmi? <a href="/register">Ro'yxatdan o'ting</a></p>
    </div>
  </main>
</div>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
